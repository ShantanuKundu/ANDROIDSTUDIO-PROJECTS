name: sky_pulse
description: "SkyPulse Weather App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Add this plugin to generate app icons automatically
  flutter_launcher_icons: ^0.13.1

# Configure the launcher icon settings
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/skypls_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Declare your asset directory here
  assets:
    - assets/images/